[project]
name = "lgpd-dev-assistant"
version = "0.1.0"
description = "Assistente RAG + tool-use para LGPD aplicada a desenvolvimento de software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
